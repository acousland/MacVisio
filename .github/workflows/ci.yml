name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install legacy reader
        run: brew install libvisio
      - name: Test
        run: swift test
      - name: Build native bundle
        run: scripts/build-app.sh
      - name: Verify bundle
        run: python3 scripts/verify-app.py
      - name: Archive test build
        run: ditto -c -k --sequesterRsrc --keepParent build/MacVisio.app build/MacVisio-test-build.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MacVisio-test-build
          path: build/MacVisio-test-build.zip
